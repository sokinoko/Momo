<style>
/* ===================================================================
   윤리와 사상 노트 — 스타일 시스템 (개정판)
   컨셉: 고문헌·경전 조판의 분위기. 먹빛 잉크와 인주(印朱) 빨강,
   남색 먹 파랑의 절제된 팔레트, 세리프(명조) 타이틀 + 담백한 본문.
   낙관(도장) 모티프를 시그니처 요소로 사용.
   =================================================================== */

:root{
  --paper:#F6F1E6;
  --paper-alt:#EFE7D6;
  --panel:#FCFAF3;
  --ink:#221F1A;
  --ink-soft:#6E6656;
  --ink-faint:#A69C87;
  --rule:#D8CDB2;
  --rule-strong:#B9AC8B;

  --red:#9C2B26;       /* 낙관 인주색 */
  --red-soft:#C3453B;
  --red-tint:#F1DEDA;
  --blue:#233A66;      /* 남색 먹 */
  --blue-soft:#3A5789;
  --blue-tint:#DFE4EF;
  --gold:#A9822E;       /* 고서 금박 */
  --gold-tint:#EEE3C4;
  --sage:#51715C;       /* 정답/완료 */
  --sage-tint:#DEE7DF;

  --font-serif: "AppleMyungjo","Nanum Myeongjo","Batang", Georgia, "Times New Roman", serif;
  --font-sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

  --radius:10px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  background-image:
    repeating-linear-gradient(180deg, rgba(34,31,26,0.028) 0px, rgba(34,31,26,0.028) 1px, transparent 1px, transparent 34px);
  color:var(--ink);
  font-family:var(--font-sans);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
  letter-spacing:-0.1px;
}

#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  padding-bottom:calc(88px + env(safe-area-inset-bottom));
  position:relative;
}

/* ---------- 공통 카드 ---------- */
.hard-box{
  background:var(--panel);
  border:1px solid var(--rule-strong);
  border-radius:var(--radius);
  box-shadow:0 1px 2px rgba(34,31,26,.05), 0 6px 16px rgba(34,31,26,.06);
}

/* ---------- 버튼 ---------- */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border:1.4px solid var(--ink);
  border-radius:9px;
  background:var(--panel);
  color:var(--ink);
  font-weight:700;
  font-size:13.5px;
  padding:10px 14px;
  box-shadow:0 1px 0 rgba(34,31,26,.12);
  cursor:pointer;
  transition:transform .08s ease, box-shadow .08s ease, opacity .08s ease;
  user-select:none;
  -webkit-user-select:none;
  font-family:var(--font-sans);
}
.btn:active{ transform:translateY(1px); box-shadow:none; }
.btn-block{ width:100%; }
.btn-primary{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.btn-red{ background:var(--red); color:#fff; border-color:var(--red); }
.btn-blue{ background:var(--blue); color:#fff; border-color:var(--blue); }
.btn-both{ background:var(--ink); color:#fff; border-color:var(--ink); }
.btn-gold{ background:var(--gold-tint); color:var(--ink); border-color:var(--gold); }
.btn-ghost{ background:transparent; box-shadow:none; border-color:var(--rule-strong); color:var(--ink-soft); }
.btn-sm{ padding:6px 11px; font-size:12px; border-width:1.2px; }
.btn:disabled{ opacity:.38; cursor:default; }
.btn-correct{ background:var(--sage); color:#fff; border-color:var(--sage); }
.btn-wrong{ background:var(--red); color:#fff; border-color:var(--red); }

/* ---------- 낙관(도장) 뱃지 ---------- */
.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:11px;
  font-weight:700;
  padding:3px 9px 3px 6px;
  border:1px solid currentColor;
  border-radius:999px;
  background:transparent;
  letter-spacing:.2px;
}
.badge .seal-ch{
  display:inline-flex; align-items:center; justify-content:center;
  width:14px;height:14px;border-radius:3px;
  font-family:var(--font-serif); font-size:10px; font-weight:700;
  background:currentColor; color:var(--panel);
}
.tag-유교{ color:var(--gold); } .tag-불교{ color:#6E4C82; } .tag-도가{ color:#3B6B5E; } .tag-근대{ color:var(--red-soft); }
.tag-서양{ color:#3D5A73; } .tag-이데올로기{ color:#7A4A3D; }

/* ---------- 헤더 ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--paper);
  border-bottom:1px solid var(--rule-strong);
  padding:15px 18px 13px;
}
.topbar h1{
  margin:0;
  font-family:var(--font-serif);
  font-size:19px;
  font-weight:700;
  letter-spacing:-.1px;
  display:flex; align-items:center; gap:9px;
}
.topbar .sub{ font-size:11.5px; color:var(--ink-soft); font-weight:500; margin-top:3px; margin-left:33px;}
.seal{
  width:26px;height:26px;border-radius:6px;
  background:var(--red);
  border:1px solid var(--red);
  flex:none;
  display:flex; align-items:center; justify-content:center;
  color:var(--paper);
  font-family:var(--font-serif);
  font-size:14px;
  font-weight:700;
  box-shadow:0 1px 2px rgba(0,0,0,.18);
}

.screen{ padding:16px 16px 10px; }

/* ---------- 홈 ---------- */
.hero{
  padding:20px 18px;
  margin-bottom:18px;
  position:relative;
}
.hero h2{ margin:0 0 8px; font-family:var(--font-serif); font-size:19px; font-weight:700; }
.hero p{ margin:0; font-size:12.8px; color:var(--ink-soft); line-height:1.6; }
.hero-stats{ display:flex; gap:0; margin-top:16px; border-top:1px solid var(--rule); padding-top:14px;}
.hero-stat{ flex:1; text-align:center; border-left:1px solid var(--rule); }
.hero-stat:first-child{ border-left:none; }
.hero-stat b{ display:block; font-family:var(--font-serif); font-size:20px; font-weight:700;}
.hero-stat span{ font-size:10.5px; color:var(--ink-soft); font-weight:600; }

.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }

.nav-card{
  padding:15px 14px;
  text-align:left;
  cursor:pointer;
}
.nav-card .ic{
  width:26px; height:26px; border-radius:6px;
  border:1px solid var(--ink);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-serif); font-size:14px; font-weight:700;
}
.nav-card .t{ font-family:var(--font-serif); font-weight:700; font-size:14px; margin-top:9px; }
.nav-card .d{ font-size:11px; color:var(--ink-soft); margin-top:2px; line-height:1.4;}

.section-title{
  font-family:var(--font-serif);
  font-size:13.5px; font-weight:700; color:var(--ink);
  margin:22px 0 9px; display:flex; align-items:center; gap:8px;
  letter-spacing:.1px;
  padding-left:9px;
  border-left:3px solid var(--red);
}
.era-label{
  font-size:11px; font-weight:700; color:var(--ink-faint);
  margin:14px 0 6px 4px;
  letter-spacing:1px;
  text-transform:uppercase;
}

/* ---------- 사상가 리스트 ---------- */
.search-box{
  display:flex; gap:8px; margin-bottom:16px;
}
.search-box input{
  flex:1;
  border:1px solid var(--rule-strong);
  border-radius:9px;
  padding:11px 13px;
  font-size:14px;
  background:var(--panel);
  font-family:var(--font-sans);
}
.search-box input:focus{ outline:none; border-color:var(--ink); }

.topic-row{
  display:flex; align-items:center; gap:12px;
  padding:13px 15px;
  margin-bottom:9px;
  cursor:pointer;
}
.topic-row .num{
  width:28px;height:28px;border-radius:6px;
  border:1px solid var(--rule-strong);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-serif); font-weight:700; font-size:12.5px; flex:none;
  color:var(--ink-soft);
  background:var(--paper-alt);
}
.topic-row .info{ flex:1; min-width:0; }
.topic-row .info .tt{ font-family:var(--font-serif); font-weight:700; font-size:15px; }
.topic-row .info .ss{ font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.topic-row .prog{ font-size:10.5px; font-weight:600; color:var(--ink-faint); flex:none; text-align:right;}
.topic-row .prog b{ display:block; font-family:var(--font-serif); font-size:14px; color:var(--ink); font-weight:700;}

/* ---------- 사상가 상세 / 정리 ---------- */
.detail-head{ padding:18px; margin-bottom:16px; }
.detail-head h2{ margin:8px 0 0; font-family:var(--font-serif); font-size:21px; font-weight:700; }
.detail-head .ss{ font-size:12px; color:var(--ink-soft); font-weight:500; margin-top:3px;}
.detail-tabs{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }

.outline{ list-style:none; margin:0; padding:0; }
.outline li{
  display:flex; align-items:flex-start; gap:10px;
  padding:8px 0;
  border-bottom:1px solid var(--rule);
  font-size:13.6px; line-height:1.62;
}
.outline li:last-child{ border-bottom:none; }
.outline .chk{
  width:16px;height:16px; flex:none; margin-top:3px;
  border:1.3px solid var(--ink-faint); border-radius:3px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:900; color:transparent;
  background:transparent;
}
.outline .chk.done{ color:#fff; background:var(--red); border-color:var(--red); }
.outline .txt{ flex:1; }
.outline .i0{ margin-left:0; font-weight:700; }
.outline .i1{ margin-left:14px; }
.outline .i2{ margin-left:28px; font-size:13px; color:var(--ink-soft); }
.outline .i3{ margin-left:42px; font-size:12.5px; color:var(--ink-soft); }
.outline .i4{ margin-left:56px; font-size:12px; color:var(--ink-faint); }

.term.red{ color:var(--red); font-weight:700; }
.term.blue{ color:var(--blue); font-weight:700; }
.note{ font-size:11.5px; color:var(--ink-faint); font-style:normal; }

.deep-toggle{
  margin:18px 0 9px;
  padding:11px 14px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:space-between;
  background:var(--paper-alt);
  font-family:var(--font-serif);
  font-weight:700;
  font-size:13.5px;
}

/* ---------- 표(테이블) ---------- */
.table-wrap{ overflow-x:auto; margin:14px 0; border:1px solid var(--rule-strong); border-radius:8px;}
.cmp-table{
  border-collapse:collapse;
  width:100%;
  min-width:100%;
  font-size:12.2px;
}
.cmp-table th, .cmp-table td{
  border:1px solid var(--rule);
  padding:9px 9px;
  text-align:left;
  vertical-align:top;
  line-height:1.45;
}
.cmp-table th{
  background:var(--ink);
  color:var(--paper);
  font-weight:700;
  font-family:var(--font-serif);
  white-space:nowrap;
  border-color:var(--ink);
}
.cmp-table td{ background:var(--panel); }
.table-title{ font-family:var(--font-serif); font-weight:700; font-size:14px; margin:20px 0 2px; }

/* ---------- 빈칸학습 ---------- */
.mode-pick{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin:15px 0; }
.mode-pick button{ flex-direction:column; padding:14px 6px; font-size:12.5px; }
.mode-pick .sw{ width:16px;height:16px;border-radius:50%;border:1.3px solid var(--ink); margin-bottom:7px;}
.sw-red{ background:var(--red); } .sw-blue{ background:var(--blue); } .sw-black{ background:var(--ink); }
.sw-both{ background:linear-gradient(135deg,var(--red) 50%, var(--blue) 50%); }

.blank{
  display:inline-block;
  min-width:24px;
  padding:0 4px;
  border-radius:3px;
  cursor:pointer;
  font-weight:700;
}
.blank.hidden.red{ background:var(--red); color:var(--red); }
.blank.hidden.blue{ background:var(--blue); color:var(--blue); }
.blank.hidden.black{ background:var(--ink); color:var(--ink); }
.blank.shown.red{ background:var(--red-tint); color:var(--red); box-shadow:inset 0 -1.5px 0 var(--red); }
.blank.shown.blue{ background:var(--blue-tint); color:var(--blue); box-shadow:inset 0 -1.5px 0 var(--blue); }
.blank.shown.black{ background:var(--paper-alt); color:var(--ink); box-shadow:inset 0 -1.5px 0 var(--ink); }

.practice-toolbar{
  position:sticky; top:64px; z-index:10;
  display:flex; gap:8px; padding:11px 0; background:var(--paper);
}

/* ---------- 오늘의 문제 ---------- */
.flashcard{
  padding:26px 20px;
  min-height:180px;
  display:flex; flex-direction:column; justify-content:center;
  margin-bottom:16px;
  position:relative;
}
.flashcard .qn{ font-size:10.5px; font-weight:700; color:var(--ink-faint); margin-bottom:12px; letter-spacing:.2px;}
.flashcard .stem{ font-family:var(--font-serif); font-size:16.5px; line-height:1.68; font-weight:500; }
.flashcard .blankword{
  display:inline-block; min-width:60px; border-bottom:2px solid var(--ink); text-align:center; margin:0 2px;
}
.flashcard .answer{
  margin-top:18px; padding-top:15px; border-top:1px solid var(--rule);
  font-family:var(--font-serif);
  font-size:17px; font-weight:700;
}
.flashcard .answer.red{ color:var(--red); }
.flashcard .answer.blue{ color:var(--blue); }
.flashcard .src{ margin-top:8px; font-size:11px; color:var(--ink-soft);}

.grade-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.quiz-progress{ display:flex; gap:4px; margin-bottom:15px; }
.quiz-progress .dot{ flex:1; height:5px; border-radius:3px; background:var(--rule); }
.quiz-progress .dot.ok{ background:var(--sage); }
.quiz-progress .dot.no{ background:var(--red); }
.quiz-progress .dot.now{ background:var(--gold); }

.quiz-done{ text-align:center; padding:32px 18px; }
.quiz-done .big{ font-family:var(--font-serif); font-size:38px; font-weight:700; }

/* ---------- 매칭 퀴즈 ---------- */
.match-stem{
  font-family:var(--font-serif);
  font-size:15.5px; font-weight:500; line-height:1.68;
  padding:16px 14px; margin:10px 0 15px;
  background:var(--paper-alt); border-radius:8px;
  border:1px solid var(--rule-strong);
}
.match-score{ font-size:11.5px; font-weight:600; color:var(--ink-soft); }

/* ---------- 백지 복습 ---------- */
.paper-area{
  width:100%;
  min-height:340px;
  border:1px solid var(--rule-strong);
  border-radius:10px;
  background:
    repeating-linear-gradient(180deg, transparent 0, transparent 29px, var(--rule) 30px),
    var(--panel);
  background-position: 0 6px;
  padding:14px 14px 14px 14px;
  font-size:15px;
  line-height:30px;
  font-family:var(--font-sans);
  color:var(--ink);
  resize:vertical;
  box-sizing:border-box;
}
.paper-area:focus{ outline:none; border-color:var(--ink); }
.paper-meta{ display:flex; justify-content:space-between; align-items:center; margin:8px 0 4px; font-size:11.5px; color:var(--ink-soft); }
.compare-wrap{ margin-top:18px; }
.compare-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.compare-head .t{ font-family:var(--font-serif); font-weight:700; font-size:14px; }
.stat-box{ padding:15px; margin-bottom:9px; display:flex; align-items:center; justify-content:space-between; }
.stat-box .l{ font-size:12.5px; font-weight:600; color:var(--ink-soft); }
.stat-box .v{ font-family:var(--font-serif); font-size:19px; font-weight:700; }
.progress-bar{ height:8px; border:1px solid var(--rule-strong); border-radius:5px; background:var(--panel); overflow:hidden; margin-top:7px;}
.progress-bar > div{ height:100%; background:var(--gold); }

.wrong-item{ padding:11px 14px; margin-bottom:8px; font-size:13px; display:flex; justify-content:space-between; gap:10px; align-items:center;}

/* ---------- 손글씨 (Apple Pencil) ---------- */
.mode-toggle-row{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0; }
.canvas-toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.pen-swatch{
  width:28px; height:28px; border-radius:50%; border:2px solid var(--ink);
  cursor:pointer; flex:none; position:relative;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-serif); font-size:12px; font-weight:700; color:var(--panel);
}
.pen-swatch.active{ box-shadow:0 0 0 3px var(--gold-tint); }
.pen-swatch.ink{ background:var(--ink); }
.pen-swatch.red{ background:var(--red); }
.pen-swatch.blue{ background:var(--blue); }
.pen-swatch.eraser{ background:var(--panel); color:var(--ink); }
.canvas-toolbar .spacer{ flex:1; }
.canvas-wrap{
  position:relative;
  border:1px solid var(--rule-strong);
  border-radius:10px;
  overflow:hidden;
  background:
    repeating-linear-gradient(180deg, transparent 0, transparent 29px, var(--rule) 30px),
    var(--panel);
  background-position: 0 6px;
  touch-action:none;
}
.hw-canvas{ display:block; width:100%; touch-action:none; position:relative; z-index:2; }
.canvas-guide{
  position:absolute; inset:0; z-index:1;
  opacity:0.49; pointer-events:none;
  padding:14px 14px 14px 14px;
  overflow:hidden;
}
.canvas-guide .outline{ font-size:13.5px; }
.pencil-note{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; font-size:11.5px; color:var(--ink-soft); flex-wrap:wrap; gap:8px; }
.pencil-note label{ display:flex; align-items:center; gap:5px; cursor:pointer; }

/* ---------- 계보 (경험론/합리론) ---------- */
.geneal-desc{ font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin:0 0 16px; }
.geneal-row{ display:flex; gap:10px; }
.geneal-col{ flex:1; min-width:0; }
.geneal-col-head{
  font-family:var(--font-serif); font-weight:700; font-size:13px;
  text-align:center; padding:8px 4px; border-radius:8px 8px 0 0;
  border:1.4px solid var(--ink); border-bottom:none;
}
.geneal-col-head.blue{ background:var(--blue); color:#fff; }
.geneal-col-head.red{ background:var(--red); color:#fff; }
.geneal-chain{ border:1.4px solid var(--ink); border-top:none; border-radius:0 0 8px 8px; padding:10px 6px 12px; }
.geneal-node{
  background:var(--panel); border:1px solid var(--rule-strong); border-radius:7px;
  padding:8px 8px; text-align:center; cursor:pointer;
}
.geneal-node .n{ font-weight:700; font-size:12.5px; }
.geneal-node .d{ font-size:10px; color:var(--ink-soft); margin-top:2px; line-height:1.35; }
.geneal-node.blue .n{ color:var(--blue); }
.geneal-node.red .n{ color:var(--red); }
.geneal-arrow{ text-align:center; font-size:13px; color:var(--ink-faint); padding:2px 0; }

/* ---------- 하단 탭바 ---------- */
.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:var(--panel);
  border-top:1px solid var(--rule-strong);
  display:flex;
  max-width:560px; margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1;
  background:none; border:none;
  padding:10px 2px 11px;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  font-size:10px; font-weight:600; color:var(--ink-faint);
  cursor:pointer;
  border-top:2px solid transparent;
}
.tabbar button .ic{
  font-family:var(--font-serif);
  font-size:14.5px; font-weight:700;
  width:22px; height:22px; border-radius:5px;
  display:flex; align-items:center; justify-content:center;
}
.tabbar button.active{ color:var(--ink); border-top-color:var(--red); }
.tabbar button.active .ic{ background:var(--red); color:#fff; }

.empty{ text-align:center; padding:44px 20px; color:var(--ink-soft); font-size:13px; }
.empty .ic{ font-family:var(--font-serif); font-size:15px; margin-bottom:10px; color:var(--ink-faint); }

::selection{ background:var(--gold-tint); }

@media (max-width:360px){
  .grid3{ grid-template-columns:1fr 1fr 1fr; }
  .mode-pick{ gap:6px; }
}

"}, {"i": 2, "t": "b. <r>덕 윤리<\/r>: 인간의 품성, 인성, 됨됨이 중시"}, {"i": 3, "t": "㉠ 반복, 실천, 습관화 중시"}, {"i": 3, "t": "㉡ 인간관계 중시: <b>공동체주의(가족,시민사회,국가)<\/b>"}, {"i": 1, "t": "④ 함정선지: 개별적 좋음과 보편적 좋음 분리 (가능,불가)"}], "era": "고대"}, {"id": "stoicism", "unit": "서양", "order": 19, "title": "스토아 학파", "subtitle": "서양 고대 헬레니즘 시대 (1)", "outline": [{"i": 0, "t": "1. 시대: B.C 4C 알렉산더의 동방원정"}, {"i": 1, "t": "① 전쟁의 혼란기: <b>마음의 평온 추구<\/b>(안심)"}, {"i": 1, "t": "② 죽음을 목격: <b>운명론 추구<\/b>(입명)"}, {"i": 1, "t": "③ 정치 참여의 필요성"}, {"i": 0, "t": "2. 학자: 제논, 에픽테토스(노예), 아우렐리우스(황제)"}, {"i": 0, "t": "3. 진리관: <b>범신론<\/b>(자연 만물에 신이 있다)"}, {"i": 1, "t": "① <r>로고스의 지배<\/r>: 자연의 법칙, 신의 섭리, 신적 이성"}, {"i": 1, "t": "② <r>운명론적 사고<\/r>: 모든 일은 인간의지로 변화 불가"}, {"i": 2, "t": "a. 로고스에 따르는 삶을 추구"}, {"i": 2, "t": "b. 자연의 필연성에 따르는 삶을 추구"}, {"i": 1, "t": "③ 단, 외부 사건은 결정되었으나, <r>나의 판단과 생각은 미결정<\/r>"}, {"i": 2, "t": "a. 나의 판단과 생각이 <r>동요되지 않아야 함<\/r>."}, {"i": 2, "t": "b. <r>부동심<\/r>: 외부 사건에 동요되지 않음"}, {"i": 0, "t": "4. 마음의 평온 추구 방법: 아파테이아"}, {"i": 1, "t": "① 어원: a+pathos+eia 없는+정념+상태"}, {"i": 1, "t": "② 의미: <r>정념에서 해방된 상태<\/r>"}, {"i": 2, "t": "a. 정념: 욕구,열망,감각,열정…"}, {"i": 3, "t": "㉠ <r>자연적 정념<\/r>: 자기애, 부모에 대한 사랑"}, {"i": 3, "t": "㉡ 비자연적 정념: 권력욕, 명예욕, 지나친 쾌락"}, {"i": 2, "t": "b. 자연적 정념은 허용하되, 비자연적 정념 제거"}, {"i": 3, "t": "㉠ 이성을 방해하기 때문: 이성·사유 계열"}, {"i": 3, "t": "㉡ 마음을 동요시키는 요인"}, {"i": 2, "t": "c. <b>고통을 감내하는 것도 마음의 평온에 기여<\/b>"}, {"i": 2, "t": "d. <b>함정<\/b>: 모든 정념 제거(X), 해방(O), 초연(O)"}, {"i": 0, "t": "5. 만민평등사상: <r>사해동포주의<\/r>"}, {"i": 1, "t": "① <r>대우주<\/r>: 자연, 로고스의 지배(신적 이성)"}, {"i": 1, "t": "② <r>소우주<\/r>: 인간, 이성의 지배(개인 이성)"}, {"i": 1, "t": "③ 의미: 인간은 <b>이성을 가진 한<\/b>, 평등하다."}], "era": "고대"}, {"id": "epicureanism", "unit": "서양", "order": 20, "title": "에피쿠로스 학파", "subtitle": "서양 고대 헬레니즘 시대 (2)", "outline": [{"i": 0, "t": "1. 시대: B.C 4C 전쟁의 혼란기"}, {"i": 1, "t": "① 마음의 평온 추구○, 운명론 부정"}, {"i": 1, "t": "② 정치 참여X; <r>개인주의, 은둔주의 추구<\/r>"}, {"i": 2, "t": "a. 소수의 친한 친구와 우정을 나누는 삶"}, {"i": 2, "t": "b. 인간관계에서 <r>정의 추구<\/r>: 상호 이익을 나눔"  이성은 참·거짓의 <b>사실 판단에 도움<\/b>"}, {"i": 2, "t": "b. 감정의 역할: <b>이성을 지배<\/b>"}, {"i": 3, "t": "㉠ 감정은 선악 판단 가능"}, {"i": 3, "t": "㉡ 감정은 <b>도덕적 행동(행위)의 동기<\/b>: 공감,동정심"}, {"i": 2, "t": "c. 이성과 감정의 관계: <r>이성은 감정의 노예<\/r>"}, {"i": 3, "t": "㉠ 이성은 정념(감정)이 기초하는 믿음의 <b>진위 판단<\/b>"}, {"i": 3, "t": "㉡ 이성은 <b>추론적 사유, 합리적 대책 수립<\/b>"}, {"i": 3, "t": "㉢ 이성은 도덕 판단은 못하지만 <b>보조도구다<\/b>."}, {"i": 0, "t": "4. 흄의 특징: <r>회의주의<\/r>(진리 자체 의심)"}, {"i": 1, "t": "① 이 세상의 인과관계는 <b>반복된 관찰과 실험의 결과일 뿐<\/b>"}, {"i": 1, "t": "② <r>필연적 인과관계 부정<\/r>"}, {"i": 1, "t": "③ 진리는 <b>객관적 실재가 아니라<\/b>, 심리적 성향과 습관에 불과"}, {"i": 0, "t": "5. 도덕의 기초: 감정 → 공감능력 → 동정심"}, {"i": 1, "t": "동정심은 도덕의 기초이다."}], "era": "근대"}, {"id": "utilitarianism", "unit": "서양", "order": 25, "title": "공리주의", "subtitle": "서양 근대 경험론 (3) · Utility(유용성)", "outline": [{"i": 0, "t": "1. 시대: 19C 영국, IR(산업혁명) 직후"}, {"i": 1, "t": "① 다수의 노동자의 처참한 삶: 고통 증가"}, {"i": 1, "t": "② 소수의 자본가의 지나친 이익 추구: <r>횡포<\/r>"}, {"i": 0, "t": "2. 진리관: <r>쾌락주의<\/r>(쾌락은 선, 고통은 악)"}, {"i": 1, "t": "① <b>사회적 쾌락의 필요성 강조<\/b>"}, {"i": 2, "t": "a. 개인적 쾌락+사회적 쾌락 조화"}, {"i": 2, "t": "b. 사익과 공익의 조화: <r>사회적 유용성 증가<\/r>"}, {"i": 1, "t": "② 핵심 주장: <r>최대 다수의 최대 행복<\/r>"}, {"i": 2, "t": "a. <r>결과론적 윤리설<\/r>: 행위의 결과 고통 감소, 쾌락 증진 추구"}, {"i": 2, "t": "b. 고통과 쾌락, 이익과 손해 계산 강조"}, {"i": 0, "t": "3. 양적 공리주의: <r>벤담<\/r> 「도덕과 입법의 원리」★"}, {"i": 1, "t": "① 쾌락은 오직 한 종류(질적 차이X, 양적 차이○)"}, {"i": 1, "t": "② 쾌락의 비교 기준: <b>7가지<\/b>(강도,지속성,확실성…)"}, {"i": 1, "t": "③ 자본가 견제 방법: <r>외적 제재<\/r>(법률적,종교적 제재)"}, {"i": 0, "t": "4. 질적 공리주의: <b>밀<\/b>"}, {"i": 1, "t": "① 쾌락은 여러 종류(질적 차이○,양적 차이○)"}, {"i": 1, "t": "② 쾌락의 비교 기준: <r>쾌락의 전문가 도입<\/r>"}, {"i": 2, "t": "a. <r>다량 저급 쾌락보다 소량 고급 쾌락 중시<\/r>"}, {"i": 3, "t": "㉠ 배부른 돼지 < 배고픈 인간"}, {"i": 3, "t": "㉡ 만족하는 바보 < 불만족하는 소크라테스"}, {"i": 2, "t": "b. <r>육체적 쾌락보다 정신적 쾌락 중시<\/r>(≒에피쿠로스)"}, {"i": 2, "t": "c. 단, 쾌락주의 이탈이라는 비판을 받음"}, {"i": 1, "t": "③ 자본가 견제 방법: <r>외적<내적 제재<\/r>(교육 통해 이타심↑)"}, {"i": 0, "t": "5. 현대 공리주의: <b>규칙 공리주의<\/b>"}, {"i": 1, "t": "① 기존 공리주의를 비판: 직관과 상식의 위배"}, {"i": 2, "t": "ex. 살인,절도 등의 수단도 결과만 좋으면 허용"}, {"i": 1, "t": "② 규칙 준수 시의 결과를 고려: <r>최·다·최·행<\/r>"}, {"i": 2, "t": "⇒ 이미 유용성이 검증된 규칙은 <b>직관과 상식에 부합<\/b>"}], "era": "근대"}, {"id": "descartes", "unit": "서양", "order": 26, "title": "데카르트", "subtitle": "서양 근대 합리론 (1)", "outline": [{"i": 0, "t": "1. 시대: 17C 프랑스, 합리론의 창시자"}, {"i": 0, "t": "2. 진리관: <r>연역적 진리<\/r>(이성적 논리 추론 강조)"}, {"i": 1, "t": "① 베이컨의 귀납적 진리 비판: 오차·오류 발생"}, {"i": 1, "t": "② 연역적 진리 추론 방법: <r>삼단논법<\/r>"}, {"i": 2, "t": "a. 대전제: 사람은 죽는다. P→q"}, {"i": 2, "t": "b. 소전제: 소크라테스는 사람이다. r→P"}, {"i": 2, "t": "c. 결론: 소크라테스는 죽는다. r→q"}, {"i": 1, "t": "③ 연역법의 장점: 논리적 오류 없음"}, {"i": 1, "t": "④ 연역법의 단점:"}, {"i": 2, "t": "a. 새로운 지식 추가 불가"}, {"i": 2, "t": "b. 대전제가 의심스러우면 논리 전체가 오류"}, {"i": 0, "t": "3. 진리 탐구의 방법: <b>방법적 회의<\/b>"}, {"i": 1, "t": "① 의미: 모든 것을 의심하여 진리 탐구"}, {"i": 1, "t": "② 결과물: <r>나는 생각한다, 고로 나는 존재한다.<\/r>"}, {"i": 2, "t": "a. 코기토 명제 Cogito, ergo sum"}, {"i": 2, "t": "b. <b>철학의 제1원리<\/b>: 자명한 진리"}, {"i": 2, "t": "c. <r>인식의 출발점<\/r>: 사유하는 존재의 확실성"}, {"i": 1, "t": "③ 함정 선지"}, {"i": 2, "t": "a. 철학의 제1원리는 방법적 회의의 <b>출발점<\/b>(X) 결과물"}, {"i": 2, "t": "b. 철학의 제1원리로부터 진리를 추구(O) <b>출발점<\/b>"}, {"i": 0, "t": "4. 회의주의와 구분: 데카르트≠회의주의"}, {"i": 1, "t": "① 결과적 회의: 고르기아스,흄 (의심→의심)"}, {"i": 1, "t": "② 방법적 회의: 데카르트 (의심→확신)"}, {"i": 0, "t": "5. 자연관: <r>정복지향적 자연관<\/r>"}, {"i": 1, "t": "① 이분법: 인식의 주체 vs 인식의 객체 ⇒ 우열관계"}, {"i": 1, "t": "② <r>동물기계론<\/r>: 이성능력(영혼)이 없는 기계에 불과"}, {"i": 0, "t": "6. 윤리관: 이성·사유 계열 (이성적으로 살면 윤리적)"}, {"i": 1, "t": "⇒ 이성을 방해하는 정념(감각,욕망,감정)에서 해방"}], "era": "근대"}, {"id": "spinoza", "unit": "서양", "order": 27, "title": "스피노자", "subtitle": "서양 근대 합리론 (2)", "outline": [{"i": 0, "t": "1. 시대: 17C 네덜란드, 이성·사유 계열"}, {"i": 0, "t": "2. 진리관: <r>범신론<\/r>(고대 스토아 계승)"}, {"i": 1, "t": "① <b>신=자연 만물, 자연 그 자체<\/b>"}, {"i": 2, "t": "a. <r>능산적 자연<\/r>: 생산하는 자연"}, {"i": 2, "t": "b. 무한하고 완벽한 존재: 정신+물질 포함"}, {"i": 2, "t": "c. 완벽하고 필연적 존재: <b>우연은 존재X 운명○<\/b>"}, {"i": 2, "t": "d. <r>유일한 실체<\/r>: 스스로 존재, 자신 안에 존재, 존재 원인"}, {"i": 2, "t": "e. 만물의 내재적원인: 초월적 존재X"}, {"i": 1, "t": "② <b>인간,사물<\/b>: 자연의 일부, <r>신의 양태<\/r>"}, {"i": 2, "t": "a. 양태: 유일한 실체인 신이 일정한 방식으로 표현된 모습"}, {"i": 2, "t": "b. <r>소산적 자연<\/r>: 생산된 자연, 유한한 존재"}, {"i": 2, "t": "c. 양태는 실체가 없다면 존재불가."}, {"i": 0, "t": "3. 인과관계: <r>운명론적 사고<\/r>"}, {"i": 1, "t": "① 모든 것은 필연적이고 <b>필연성은 신적 본성<\/b>"}, {"i": 1, "t": "② 인간과 신은 <b>자유의지가 없음<\/b>"}, {"i": 2, "t": "a. 신은 의도적 계획 불가"}, {"i": 2, "t": "b. 자연은 인과적 필연성의 지배를 받는 <b>기계<\/b>"}, {"i": 2, "t": "c. 인간은 <b>자유의지가 없으나<\/b>, 자유로운 삶을 살 수 있음."}, {"i": 0, "t": "4. 행복론: <r>신에 대한 직관적 인식에서 나오는 정신적 만족<\/r>"}, {"i": 1, "t": "① 이성으로 완성하여 감정의 지배에서 해방"}, {"i": 1, "t": "② 단, <r>능동적 감정은 허용<\/r>"}, {"i": 2, "t": "a. <b>신에 대한 지적인 사랑<\/b>"}, {"i": 2, "t": "b. <b>자신에 대한 사랑(자기애,자기보존)<\/b>"}, {"i": 1, "t": "③ 반대로 <r>수동적 감정은 이성 반해<\/r>: 탐욕,질투,증오…"}, {"i": 0, "t": "5. <r>코나투스<\/r>: 자기보존의 욕망 <span class='note'>&lt;스피노자 심화&gt;<\/span>"}, {"i": 1, "t": "① 인간과 사물의 필연적 본성: 신의 본성 반영"}, {"i": 1, "t": "② 자기보존 욕망은 삶의 추동력"}, {"i": 1, "t": "③ 선: 자기보존을 <b>향상,증진시키는 것<\/b>(↔자기파괴)"}], "era": "근대"}, {"id": "kant", "unit": "서양", "order": 28, "title": "칸트", "subtitle": "서양 근대 합리론의 영향", "outline": [{"i": 0, "t": "1. 시대: 18C 독일, <r>관념론<\/r>(이성·사유 계열)"}, {"i": 0, "t": "1. 진리관: <r>절·의·동<\/r>"}, {"i": 1, "t": "① 절대론: 보편적·객관적 진리 (보편적인 원리)"}, {"i": 1, "t": "② 의무론: 선(의무준수), 악(의무위반), 단 의무>행복"}, {"i": 1, "t": "③ 동기론: 행위의 결과가 아닌 행위의 동기 중시"}, {"i": 2, "t": "a. 도덕적 행위의 동기"}, {"i": 3, "t": "㉠ <r>양심,선의지,실천 이성,의무의식에서 비롯<\/r>(선천적)"}, {"i": 3, "t": "㉡ <b>도덕 법칙에 대한 존경심에서 비롯<\/b>"}, {"i": 2, "t": "b. 도덕적이지 않은 행동: 용기가 잘못된 경우"}, {"i": 3, "t": "㉠ 의무위반 행위: 예(살인,절도,거짓말…)"}, {"i": 3, "t": "㉡ <r>의무에 일치(겉치레,부합)하지만 동기가 잘못된 경우<\/r>"}, {"i": 3, "t": "ex) 결과고려, 동정심, <r>경향성(쾌락추구 경향)<\/r>에서 비롯"}, {"i": 0, "t": "3. 칸트 핵심 주장: <r>정언명령<\/r>(무조건적 명령) cf. 가언명령"}, {"i": 1, "t": "① 보편화 명령: a가 b가 되게 하라"}, {"i": 2, "t": "a. 네 의지의 <r>준칙<\/r>: 개인의 행동 원칙"}, {"i": 2, "t": "b. <r>보편적 입법의 원리<\/r>: 보편화 가능성 有(확대 적용)"}, {"i": 2, "t": "c. 함정 기출: 모든 준칙은 보편화 가능하다(X) 일부"}, {"i": 1, "t": "② 인간성 명령: a하지말고 b하라"}, {"i": 2, "t": "a. 인격을 단지 수단으로 대우: 이용가치,도구적 가치 취급"}, {"i": 2, "t": "b. 인격을 동시에 목적으로 대우: <b>존엄성 존중<\/b>"}, {"i": 2, "t": "c. 함정기출: 수단이면서 동시에 목적(O) <r>가능<\/r>"}, {"i": 0, "t": "4. 신 vs 인간"}, {"i": 1, "t": "① <r>신<\/r>: 완전한(선)의지를 가진 존재"}, {"i": 2, "t": "⇒ 도덕 법칙이 의무로 부과되지 않음"}, {"i": 1, "t": "② <r>인간<\/r>: 선의지+<r>경향성도 지닌 존재<\/r>"}, {"i": 2, "t": "a. 도덕법칙도 필요, 자연법칙의 지배도 받음"}, {"i": 2, "t": "b. <b>자율적 도덕법칙<\/b>: 스스로 도덕법칙 입법"}, {"i": 0, "t": "5. 영향: <b>현대 칸트주의자 로스 조건부 의무론<\/b>(우선순위)"}], "era": "근대"}, {"id": "modern-western-philosophy", "unit": "서양", "order": 29, "title": "서양 현대 철학", "subtitle": "실존주의 · 실용주의", "outline": [{"i": 0, "t": "1. <r>실존주의<\/r>: 20C 세계대전 반이성주의, 반합리주의"}, {"i": 1, "t": "① <r>사르트르<\/r>: 무신론적 실존주의 (주체적 선택·결단 강조)"}, {"i": 2, "t": "a. 실존은 본질에 앞선다: <b>'있다'는 것이 '무엇보다' 선행<\/b> ★"}, {"i": 3, "t": "㉠ 사물: 먼저 본질 구상 후 실존 형성"}, {"i": 3, "t": "㉡ 인간: 먼저 실존이 던져진 후 본질 형성"}, {"i": 2, "t": "b. <b>인생은 B와 D사이의 C<\/b>: 선택(choice)의 중요성 강조"}, {"i": 2, "t": "c. <b>무신론<\/b>: 인간의 본질을 정해줄 신은 없음. (외부 존재 의존X)"}, {"i": 2, "t": "d. <b>자유의 부조리<\/b>: 선택의 자유○ 자유 자체 선택X"}, {"i": 1, "t": "② <r>키르케고르<\/r>: 유신론적 실존주의 (주체적으로 신을 찾는 결단)"}, {"i": 2, "t": "a. 「죽음에 이르는 병」: 주체성 상실 → 절망"}, {"i": 2, "t": "b. 실존 회복의 3단계"}, {"i": 3, "t": "ㄱ. <r>심미적 단계<\/r>: 감각적 향락을 추구 → 절망"}, {"i": 3, "t": "ㄴ. <r>윤리적 단계<\/r>: 도덕적인 삶을 추구 → 절망"}, {"i": 3, "t": "ㄷ. 종교적 단계: 절망극복 ⇒ <b>신앞에선 단독자로 결단<\/b>"}, {"i": 1, "t": "③ <b>야스퍼스<\/b>: 유신론적 실존주의"}, {"i": 2, "t": "a. 한계상황(죽음,고통,이별…)에서 신을 찾는 결단"}, {"i": 2, "t": "b. 좌절은 신의 암호, 타자와의 연대"}, {"i": 1, "t": "④ <r>하이데거<\/r>: 무신론적 실존주의"}, {"i": 2, "t": "a. 던져진 현존재: 지금 여기 나"}, {"i": 2, "t": "b. 죽음의 직시: 죽음을 앞당겨 봄(인간○ 동물X)"}, {"i": 3, "t": "㉠ 본래적 실존: 주체적 자아(<b>주체적 선택과 결단<\/b>)○"}, {"i": 3, "t": "㉡ 비본래적 실존: 객체적 자아(<b>타인이 원하는 삶<\/b>)X"}, {"i": 0, "t": "2. <r>실용주의<\/r>: 20C 미국, 경험론 (실생활의 유용성)"}, {"i": 1, "t": "① <b>퍼스<\/b>: 실용적 준칙 (실험을 통해 얻게 된 개념 중시)"}, {"i": 1, "t": "② <b>제임스<\/b>: 지식의 현금가치 (실생활의 문제해결에 기여)"}, {"i": 2, "t": "ex. 종교와 신념도 유용하다면 cash value 인정"}, {"i": 1, "t": "     return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  }catch(e){ return false; }
}

function pointerAllowed(e){
  if(e.pointerType === 'touch') return HW.allowTouch;
  return true; // pen, mouse 항상 허용
}
function getPos(e){
  const rect = HW.canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const p = (typeof e.pressure === 'number' && e.pressure > 0) ? e.pressure : 0.5;
  return { x, y, p };
}
function strokeSegmentStyle(ctx, color){
  const isEraser = color === 'eraser';
  ctx.globalCompositeOperation = isEraser ? 'destination-out' : 'source-over';
  ctx.strokeStyle = isEraser ? 'rgba(0,0,0,1)' : PEN_COLORS[color];
  return isEraser;
}
function widthFor(isEraser, pressure){
  return isEraser ? 22 : 2.2 + pressure * 3.0;
}
function midpoint(a, b){ return { x:(a.x+b.x)/2, y:(a.y+b.y)/2 }; }

function drawStraightSegment(ctx, color, a, b){
  const isEraser = strokeSegmentStyle(ctx, color);
  ctx.lineWidth = widthFor(isEraser, b.p);
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
}
// 2차 베지어 한 구간: midpoint(p0,p1) -> [제어점 p1] -> midpoint(p1,p2)
// 매 새 점마다 이 한 구간만 그리면 되므로 빠르고(O(1)), 각짐 없이 부드럽게 이어짐.
function drawQuadSegment(ctx, color, p0, p1, p2){
  const isEraser = strokeSegmentStyle(ctx, color);
  const start = midpoint(p0, p1);
  const end = midpoint(p1, p2);
  ctx.lineWidth = widthFor(isEraser, p1.p);
  ctx.beginPath();
  ctx.moveTo(start.x, start.y);
  ctx.quadraticCurveTo(p1.x, p1.y, end.x, end.y);
  ctx.stroke();
}
function drawDot(stroke){
  const ctx = HW.ctx;
  if(!ctx) return;
  const p = stroke.points[0];
  if(!p) return;
  const isEraser = strokeSegmentStyle(ctx, stroke.color);
  const r = widthFor(isEraser, p.p) / 2;
  ctx.beginPath();
  ctx.arc(p.x, p.y, r, 0, Math.PI*2);
  ctx.fillStyle = ctx.strokeStyle;
  ctx.fill();
}
// 라이브 드로잉: 방금 추가된 새 점 하나에 대응하는 구간만 그림 (증분)
function drawLatestSegment(stroke){
  const ctx = HW.ctx;
  if(!ctx) return;
  const pts = stroke.points;
  const n = pts.length;
  if(n < 2) return;
  if(n === 2){ drawStraightSegment(ctx, stroke.color, pts[0], pts[1]); return; }
  drawQuadSegment(ctx, stroke.color, pts[n-3], pts[n-2], pts[n-1]);
}
// 저장된 점 데이터로부터 스트로크 전체를 처음부터 동일한 방식으로 재구성 (되돌리기/색변경/재진입 시)
function redrawStrokeFull(stroke){
  const ctx = HW.ctx;
  if(!ctx) return;
  const pts = stroke.points;
  if(pts.length === 0) return;
  if(pts.length === 1){ drawDot(stroke); return; }
  drawStraightSegment(ctx, stroke.color, pts[0], pts[1]);
  for(let i=2;i<pts.length;i++){
    drawQuadSegment(ctx, stroke.color, pts[i-2], pts[i-1], pts[i]);
  }
}
function redrawAllStrokes(){
  const ctx = HW.ctx;
  if(!ctx || !HW.canvas) return;
  ctx.clearRect(0, 0, HW.canvas.width, HW.canvas.height);
  HW.strokes.forEach(s=> redrawStrokeFull(s));
}
function onPointerDown(e){
  if(!pointerAllowed(e)) return;
  e.preventDefault();
  HW.drawing = true;
  HW.currentStroke = { color: HW.color, points: [getPos(e)] };
  try{ HW.canvas.setPointerCapture(e.pointerId); }catch(err){}
}
function onPointerMove(e){
  if(!HW.drawing || !pointerAllowed(e)) return;
  e.preventDefault();
  // getCoalescedEvents: Apple Pencil이 화면 갱신 사이 더 촘촘히 샘플링한 점들을 모두 반영 (끊김/각짐 방지)
  const events = (typeof e.getCoalescedEvents === 'function') ? (e.getCoalescedEvents() || []) : [];
  const list = events.length ? events : [e];
  list.forEach(ev=>{
    HW.currentStroke.points.push(getPos(ev));
    drawLatestSegment(HW.currentStroke);
  });
}
function onPointerUp(e){
  if(!HW.drawing) return;
  HW.drawing = false;
  if(HW.currentStroke && HW.currentStroke.points.length >= 1){
    if(HW.currentStroke.points.length === 1) drawDot(HW.currentStroke);
    HW.strokes.push(HW.currentStroke);
    saveStrokes();
  }
  HW.currentStroke = null;
}
function initCanvas(){
  const canvas = document.getElementById('hwCanvas');
  if(!canvas) return;
  const wrap = canvas.parentElement;
  const guideEl = wrap.querySelector('.canvas-guide');
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = rect.width || wrap.clientWidth || 500;
  let cssHeight = 420;
  if(guideEl){
    const guideHeight = guideEl.scrollHeight || guideEl.offsetHeight || 0;
    cssHeight = Math.max(420, guideHeight + 28);
  }
  canvas.width = Math.max(1, Math.round(cssWidth * dpr));
  canvas.height = Math.max(1, Math.round(cssHeight * dpr));
  canvas.style.height = cssHeight + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  HW.canvas = canvas; HW.ctx = ctx; HW.dpr = dpr;
  redrawAllStrokes();
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('pointerleave', onPointerUp);
}
function loadStrokesForTopic(topicId){
  const saved = STATE.handwriting && STATE.handwriting[topicId];
  HW.strokes = saved ? JSON.parse(JSON.stringify(saved)) : [];
}
function saveStrokes(){
  if(!STATE.handwriting) STATE.handwriting = {};
  STATE.handwriting[NAV.paperTopic] = HW.strokes;
  saveStore();
}
function setPenColor(c){
  HW.color = c;
  render();
}
function undoStroke(){
  HW.strokes.pop();
  saveStrokes();
  render();
}
function clearCanvas(){
  if(!confirm('손글씨를 전부 지울까요?')) return;
  HW.strokes = [];
  saveStrokes();
  render();
}
function toggleAllowTouch(v){
  HW.allowTouch = v;
  render();
}
function toggleGuide(v){
  HW.showGuide = v;
  render();
}
function renderGuideOutline(list){
  if(!list || !list.length) return '';
  return '<ul class="outline">' + list.map(line=>{
    const html = renderLineHTML(line.t, null, '');
    return `<li><span class="txt i${line.i}">${html}</span></li>`;
  }).join('') + '</ul>';
}
function exportCanvasImage(){
  if(!HW.canvas) return;
  const url = HW.canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url;
  a.download = (NAV.paperTopic || 'handwriting') + '.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
function setPaperMode(m){
  NAV.paperMode = m;
  if(m === 'draw') loadStrokesForTopic(NAV.paperTopic);
  render();
}

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(!s.blankPaper) s.blankPaper = {};
      if(!s.handwriting) s.handwriting = {};
      return s;
    }
  }catch(e){}
  return { checked:{}, bookmarks:{}, streak:{lastDate:null,count:0},
           quiz:{ wrong:[], history:{}, lastDate:null, lastSet:[] }, blankPaper:{}, handwriting:{} };
}
function saveStore(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); }catch(e){}
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function seedFromDate(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h || 1;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}
function shuffleSeeded(arr, rng){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rng()* (i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function escAttr(s){ return String(s).replace(/"/g,'&quot;'); }
function stripMarkup(html){
  return String(html)
    .replace(/<r>(.*?)<\/r>/g,'$1')
    .replace(/<b>(.*?)<\/b>/g,'$1')
    .replace(/<span[^>]*>(.*?)<\/span>/g,'$1')
    .replace(/<[^>]+>/g,'');
}

/* ---------- 라인 렌더링 (정리 뷰 / 빈칸학습 뷰 공용) ---------- */
function renderLineHTML(text, blankSet, idPrefix){
  // 텍스트를 <r>..</r> / <b>..</b> / <span class='note'>..</span> / 순수텍스트 조각으로 토큰화
  const re = /<r>(.*?)<\/r>|<b>(.*?)<\/b>|<span class='note'>(.*?)<\/span>/g;
  const tokens = [];
  let lastIndex = 0, m;
  while((m = re.exec(text))){
    if(m.index > lastIndex) tokens.push({type:'plain', c:text.slice(lastIndex, m.index)});
    if(m[1]!==undefined) tokens.push({type:'r', c:m[1]});
    else if(m[2]!==undefined) tokens.push({type:'b', c:m[2]});
    else if(m[3]!==undefined) tokens.push({type:'note', c:m[3]});
    lastIndex = re.lastIndex;
  }
  if(lastIndex < text.length) tokens.push({type:'plain', c:text.slice(lastIndex)});

  let counter = 0;
  return tokens.map(tok=>{
    if(tok.type === 'note') return `<span class="note">${tok.c}</span>`;
    if(tok.type === 'plain'){
      if(!tok.c.trim()) return tok.c;
      if(blankSet && blankSet.has('black')){
        counter++;
        const uid = idPrefix + '-k' + counter;
        return `<span class="blank hidden black" data-uid="${uid}" onclick="toggleBlank(this)">${tok.c}</span>`;
      }
      return tok.c;
    }
    const color = tok.type === 'r' ? 'red' : 'blue';
    counter++;
    const uid = idPrefix + '-c' + counter;
    if(blankSet && blankSet.has(color)){
      return `<span class="blank hidden ${color}" data-uid="${uid}" onclick="toggleBlank(this)">${tok.c}</span>`;
    }
    return `<span class="term ${color}">${tok.c}</span>`;
  }).join('');
}

function renderOutline(topic, list, sectionKey, blankSet){
  if(!list || !list.length) return '';
  return '<ul class="outline">' + list.map((line, idx)=>{
    const lineKey = topic.id+':'+sectionKey+':'+idx;
    const checked = !!STATE.checked[lineKey];
    const html = renderLineHTML(line.t, blankSet, lineKey);
    return `<li>
      <span class="chk ${checked?'done':''}" data-key="${escAttr(lineKey)}" onclick="toggleCheck(this)">${checked?'✓':''}</span>
      <span class="txt i${line.i}">${html}</span>
    </li>`;
  }).join('') + '</ul>';
}

function renderTable(table, blankColIdx){
  const rows = table.rows.map(r=>{
    return '<tr>' + r.map((cell,ci)=>{
      const html = renderLineHTML(cell, null, '');
      const hide = (blankColIdx!==null && ci===blankColIdx);
      return `<td class="${hide?'tblank':''}" ${hide?'onclick="revealTblCell(this)"':''}>${hide?`<span class="tblank-cover">가리기</span><span class="tblank-real" style="display:none">${html}</span>`:html}</td>`;
    }).join('') + '</tr>';
  }).join('');
  const head = '<tr>' + table.cols.map((c,ci)=>`<th onclick="setTableHideCol(${ci})" style="cursor:pointer;">${c} ${blankColIdx===ci?'👁️‍🗨️':''}</th>`).join('') + '</tr>';
  return `<div class="table-title">${table.title}</div>
    <div class="table-wrap"><table class="cmp-table">${head}${rows}</table></div>
    <div class="note" style="margin:4px 2px 0;">열 제목을 탭하면 그 칸을 가려서 스스로 테스트할 수 있어요.</div>`;
}

/* ---------- 체크 / 북마크 토글 ---------- */
function toggleCheck(el){
  const key = el.getAttribute('data-key');
  STATE.checked[key] = !STATE.checked[key];
  saveStore();
  render();
}
function toggleBlank(el){
  if(el.classList.contains('hidden')){
    el.classList.remove('hidden'); el.classList.add('shown');
  } else {
    el.classList.remove('shown'); el.classList.add('hidden');
  }
}
let TBL_HIDE = {};
function setTableHideCol(ci){
  NAV.tableHideCol = (NAV.tableHideCol===ci) ? null : ci;
  render();
}
function revealTblCell(td){
  const cover = td.querySelector('.tblank-cover');
  const real = td.querySelector('.tblank-real');
  if(cover){ cover.style.display='none'; real.style.display='inline'; }
}

/* ---------- 진행률 계산 ---------- */
function topicLineCount(topic){
  let n = (topic.outline||[]).length + (topic.deep||[]).length;
  return n;
}
function topicCheckedCount(topic){
  let n = 0;
  (topic.outline||[]).forEach((l,idx)=>{ if(STATE.checked[topic.id+':outline:'+idx]) n++; });
  (topic.deep||[]).forEach((l,idx)=>{ if(STATE.checked[topic.id+':deep:'+idx]) n++; });
  return n;
}
function overallProgress(){
  let total=0, done=0;
  DATA.forEach(t=>{ total += topicLineCount(t); done += topicCheckedCount(t); });
  return {total, done, pct: total? Math.round(done/total*100):0};
}

/* ---------- 퀴즈 풀 생성 ---------- */
function buildPool(){
  const pool = [];
  DATA.forEach(topic=>{
    ['outline','deep'].forEach(sec=>{
      (topic[sec]||[]).forEach((line, idx)=>{
        const re = /<(r|b)>(.*?)<\/\1>/g;
        let m, i=0;
        while((m = re.exec(line.t))){
          i++;
          const color = m[1]==='r' ? 'red' : 'blue';
          const term = stripMarkup(m[2]);
          if(term.length < 2) continue;
          const stemRaw = line.t.slice(0, m.index) + '___BLANK___' + line.t.slice(m.index + m[0].length);
          pool.push({
            key: topic.id+':'+sec+':'+idx+':'+i,
            topicId: topic.id, topicTitle: topic.title, unit: topic.unit,
            color, term, stem: stripMarkup(stemRaw)
          });
        }
      });
    });
  });
  return pool;
}
let POOL = null;
function getPool(){ if(!POOL) POOL = buildPool(); return POOL; }

function buildDailyQuiz(force){
  const today = todayStr();
  const pool = getPool();
  if(!force && STATE.quiz.lastDate === today && STATE.quiz.lastSet && STATE.quiz.lastSet.length){
    const keys = new Set(STATE.quiz.lastSet);
    const items = pool.filter(p=>keys.has(p.key));
    if(items.length) return items;
  }
  const seedStr = force ? (today+'-'+Date.now()) : today;
  const rng = mulberry32(seedFromDate(seedStr));
  const shuffled = shuffleSeeded(pool, rng);
  const N = Math.min(10, shuffled.length);
  const items = shuffled.slice(0, N);
  STATE.quiz.lastDate = today;
  STATE.quiz.lastSet = items.map(i=>i.key);
  saveStore();
  return items;
}

function markDailyActivity(){
  const today = todayStr();
  if(STATE.streak.lastDate === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yStr = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  STATE.streak.count = (STATE.streak.lastDate === yStr) ? (STATE.streak.count+1) : 1;
  STATE.streak.lastDate = today;
  saveStore();
}

function gradeQuizItem(item, correct){
  markDailyActivity();
  const today = todayStr();
  if(!STATE.quiz.history[today]) STATE.quiz.history[today] = {done:0, correct:0};
  STATE.quiz.history[today].done++;
  if(correct) STATE.quiz.history[today].correct++;
  else {
    STATE.quiz.wrong = STATE.quiz.wrong.filter(w=>w.key!==item.key);
    STATE.quiz.wrong.unshift({key:item.key, term:item.term, color:item.color, stem:item.stem, topicTitle:item.topicTitle, ts:Date.now()});
    STATE.quiz.wrong = STATE.quiz.wrong.slice(0,60);
  }
  saveStore();
}

</script>
<script>
/* ===================================================================
   화면(뷰) 렌더링
   =================================================================== */

function go(view, extra){
  NAV.view = view;
  if(extra) Object.assign(NAV, extra);
  render();
  const scrollEl = document.getElementById('scrollArea');
  if(scrollEl) scrollEl.scrollTop = 0;
}

function headerTitle(){
  const map = { home:['윤리와 사상 노트','1~3단원 · 동양·서양·이데올로기'], topics:['사상가별 정리','필기 원문 기반 정리'],
    topicDetail:['','' ], blankSetup:['빈칸학습','빨간펜 · 파란펜 가리개'], blankPractice:['빈칸학습',''],
    paperSetup:['백지복습','아무것도 안 보고 직접 써보기'], paperWrite:['백지복습',''],
    quiz:['오늘의 문제','매일 새로운 8~10문제'], tables:['비교표 모아보기','헷갈리는 개념 한눈에'],
    stats:['학습 통계','', ] };
  return map[NAV.view] || ['윤리와 사상 노트',''];
}

function render(){
  const root = document.getElementById('screen');
  let html = '';
  switch(NAV.view){
    case 'home': html = renderHome(); break;
    case 'topics': html = renderTopics(); break;
    case 'topicDetail': html = renderTopicDetail(); break;
    case 'blankSetup': html = renderBlankSetup(); break;
    case 'blankPractice': html = renderBlankPractice(); break;
    case 'paperSetup': html = renderPaperSetup(); break;
    case 'paperWrite': html = renderPaperWrite(); break;
    case 'quiz': html = renderQuiz(); break;
    case 'tables': html = renderTables(); break;
    case 'stats': html = renderStats(); break;
    default: html = renderHome();
  }
  root.innerHTML = html;
  renderTopbar();
  renderTabbar();
  if(NAV.view === 'paperWrite' && NAV.paperMode === 'draw'){
    initCanvas();
  }
}

function renderTopbar(){
  const [t,s] = headerTitle();
  const bar = document.getElementById('topbar');
  if(NAV.view==='topicDetail'){ bar.style.display='none'; return; }
  bar.style.display='block';
  bar.innerHTML = `<h1><span class="seal">思</span>${t}</h1>${s?`<div class="sub">${s}</div>`:''}`;
}

function renderTabbar(){
  const tabs = [
    {v:'home', ic:'家', label:'홈'},
    {v:'topics', ic:'卷', label:'정리'},
    {v:'blankSetup', ic:'空', label:'빈칸학습'},
    {v:'paperSetup', ic:'白', label:'백지복습'},
    {v:'quiz', ic:'問', label:'오늘의문제'},
    {v:'tables', ic:'表', label:'비교표'},
    {v:'stats', ic:'計', label:'통계'},
  ];
  const activeSet = {
    topicDetail:'topics', blankPractice:'blankSetup', paperWrite:'paperSetup'
  };
  const active = activeSet[NAV.view] || NAV.view;
  document.getElementById('tabbar').innerHTML = tabs.map(t=>
    `<button class="${active===t.v?'active':''}" onclick="go('${t.v}')"><span class="ic">${t.ic}</span>${t.label}</button>`
  ).join('');
}

/* ---------- 홈 ---------- */
function renderHome(){
  const prog = overallProgress();
  const streak = STATE.streak.count || 0;
  const wrongN = (STATE.quiz.wrong||[]).length;
  return `
  <div class="screen">
    <div class="hero hard-box">
      <h2>윤리와 사상 올인원 학습 앱입니다.</h2>
      <p>필기 기반 윤리와 사상 노트예요. 빨간펜·파란펜 가리개로 복습하고,<br>오늘의 문제로 하루 8~10개씩 확인해보세요.</p>
      <div class="hero-stats">
        <div class="hero-stat"><b>${prog.pct}%</b><span>전체 진도</span></div>
        <div class="hero-stat"><b>${streak}일</b><span>연속 학습</span></div>
        <div class="hero-stat"><b>${wrongN}</b><span>오답노트</span></div>
      </div>
    </div>

    <div class="section-title">바로가기</div>
    <div class="grid2">
      <div class="hard-box nav-card" onclick="go('blankSetup')">
        <div class="ic">空</div><div class="t">빈칸학습</div>
        <div class="d">빨강 / 파랑 / 둘 다 가리기</div>
      </div>
      <div class="hard-box nav-card" onclick="go('quiz')">
        <div class="ic">問</div><div class="t">오늘의 문제</div>
        <div class="d">오늘 날짜 기준 랜덤 8~10문제</div>
      </div>
      <div class="hard-box nav-card" onclick="go('tables')">
        <div class="ic">表</div><div class="t">비교표 모아보기</div>
        <div class="d">공맹순 · 이황이이 등 9개 표</div>
      </div>
      <div class="hard-box nav-card" onclick="go('topics')">
        <div class="ic">卷</div><div class="t">사상가별 정리</div>
        <div class="d">${DATA.length}개 주제 전체 보기</div>

/* ---------- 사상가별 정리 : 목록 ---------- */
function renderTopics(){
  const q = NAV.searchQ.trim();
  let matches = null;
  if(q){
    matches = [];
    DATA.forEach(topic=>{
      ['outline','deep'].forEach(sec=>{
        (topic[sec]||[]).forEach(line=>{
          const plain = stripMarkup(line.t);
          if(plain.includes(q)){
            matches.push({topicId:topic.id, topicTitle:topic.title, snippet:plain});
          }
        });
      });
    });
  }
  let body = '';
  if(matches){
    body = matches.length ? matches.slice(0,40).map(m=>`
      <div class="hard-box topic-row" onclick="go('topicDetail',{topicId:'${m.topicId}'})">
        <div class="info"><div class="tt">${m.topicTitle}</div><div class="ss">${highlightQ(m.snippet,q)}</div></div>
      </div>`).join('') : `<div class="empty"><div class="ic">無</div>'${q}'에 대한 검색 결과가 없어요</div>`;
  } else {
    body = UNIT_ORDER.map(u=>{
      const topics = DATA.filter(t=>t.unit===u).sort((a,b)=>a.order-b.order);
      const hasEra = topics.some(t=>t.era);
      const header = `<div class="section-title">${UNIT_ICON[u]} ${UNIT_LABEL[u]}</div>`;
      if(!hasEra){
        return header + topics.map(t=>renderTopicRow(t)).join('');
      }
      const ERA_ORDER = ['고대','중세','근대','현대'];
      const byEra = ERA_ORDER.map(era=>({era, list: topics.filter(t=>t.era===era)})).filter(g=>g.list.length);
      return header + byEra.map(g=>`
        <div class="era-label">${g.era}</div>
        ${g.list.map(t=>renderTopicRow(t)).join('')}
      `).join('');
    }).join('');
  }
  return `<div class="screen">
    <div class="search-box">
      <input type="text" placeholder="개념·용어 검색 (예: 격물치지)" value="${escAttr(q)}" oninput="onSearchInput(this.value)"/>
    </div>
    ${body}
  </div>`;
}
function renderTopicRow(t){
  const total = topicLineCount(t), done = topicCheckedCount(t);
  const pct = total? Math.round(done/total*100):0;
  return `<div class="hard-box topic-row" onclick="go('topicDetail',{topicId:'${t.id}'})">
    <div class="num">${t.order}</div>
    <div class="info"><div class="tt">${t.title}</div><div class="ss">${t.subtitle}</div></div>
    <div class="prog"><b>${pct}%</b>${done}/${total}</div>
  </div>`;
}
function highlightQ(text, q){
  const i = text.indexOf(q);
  if(i<0) return text.slice(0,60);
  const s = Math.max(0, i-14);
  return (s>0?'…':'') + text.slice(s, i) + '<b style="background:#F4B400;">' + q + '</b>' + text.slice(i+q.length, i+q.length+30);
}
let searchDebounce = null;
function onSearchInput(v){
  NAV.searchQ = v;
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(()=>{ render(); const el=document.querySelector('.search-box input'); if(el){el.focus(); el.setSelectionRange(v.length,v.length);} }, 120);
}

function renderQuiz(){
  if(!NAV.quiz){
    const items = buildDailyQuiz(false);
    NAV.quiz = { items, idx:0, results:[], flipped:false };
  }
  const q = NAV.quiz;
  if(q.items.length===0){
    return `<div class="screen"><div class="empty"><div class="ic">無</div>문제를 만들 자료가 아직 없어요</div></div>`;
  }
  if(q.idx >= q.items.length){
    const correct = q.results.filter(r=>r).length;
    return `<div class="screen">
      <div class="hard-box quiz-done">
        <div class="ss">오늘의 학습 완료!</div>
        <div class="big">${correct} / ${q.items.length}</div>
        <div class="ss" style="margin-top:6px;">연속 ${STATE.streak.count}일째 학습 중이에요</div>

        <button class="btn btn-block" style="margin-top:10px;" onclick="regenQuiz()">새 문제 8~10개 받기</button>
      </div>
    </div>`;
  }
  const item = q.items[q.idx];
  const stemHtml = item.stem.replace('___BLANK___', '<span class="blankword">?</span>');
  return `<div class="screen">
    <div class="quiz-progress">
      ${q.items.map((it,i)=>`<div class="dot ${i<q.idx ? (q.results[i]?'ok':'no') : (i===q.idx?'now':'')}"></div>`).join('')}
    </div>
    <div class="hard-box flashcard">
      <div class="qn">${q.idx+1} / ${q.items.length} · ${item.topicTitle}</div>
      <div class="stem">${stemHtml}</div>
      ${q.flipped ? `<div class="answer ${item.color}">정답: ${item.term}</div>` : ''}
    </div>
    ${!q.flipped ? `
      <button class="btn btn-primary btn-block" style="padding:14px;" onclick="flipQuiz()">정답 보기</button>
    ` : `
      <div class="grade-row">
        <button class="btn btn-red" style="padding:14px;" onclick="answerQuiz(false)">다시 볼래요</button>
        <button class="btn btn-correct" style="padding:14px;" onclick="answerQuiz(true)">맞았어요</button>
      </div>
    `}
  </div>`;
}
function flipQuiz(){ NAV.quiz.flipped = true; render(); }
function answerQuiz(correct){
  const item = NAV.quiz.items[NAV.quiz.idx];
  gradeQuizItem(item, correct);
  NAV.quiz.results[NAV.quiz.idx] = correct;
  NAV.quiz.idx++;
  NAV.quiz.flipped = false;
  render();
}
function regenQuiz(){
  const items = buildDailyQuiz(true);
  NAV.quiz = { items, idx:0, results:[], flipped:false };
  render();
}

/* ---------- 비교표 모아보기 ---------- */
function renderGenealogy(){
  return `<div class="hard-box" style="padding:16px;">
    <div class="table-title" style="margin-top:0;">${GENEALOGY.title}</div>
    <div class="geneal-desc">${GENEALOGY.desc}</div>
    <div class="geneal-row">
      ${GENEALOGY.cols.map(col=>`
        <div class="geneal-col">
          <div class="geneal-col-head ${col.color}">${col.label}</div>
          <div class="geneal-chain">
            ${col.chain.map((node,i)=>`
              <div class="geneal-node ${col.color}" onclick="go('topicDetail',{topicId:'${node.id}'})">
                <div class="n">${node.name}</div>
                <div class="d">${node.note}</div>
              </div>
              ${i<col.chain.length-1?'<div class="geneal-arrow">↓</div>':''}
            `).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  </div>`;
}

function renderTables(){
  const withTable = DATA.filter(t=>t.table).sort((a,b)=>a.order-b.order);
  if(NAV.tableIdx >= withTable.length) NAV.tableIdx = 0;
  const topic = withTable[NAV.tableIdx];

  const chips = `<div style="display:flex; gap:8px; margin-bottom:12px; overflow-x:auto; padding-bottom:4px;">
      <button class="btn btn-sm ${NAV.showGenealogy?'btn-gold':''}" style="flex:none;" onclick="NAV.showGenealogy=true; render();">📜 경험론·합리론 계보</button>
      ${withTable.map((t,i)=>`<button class="btn btn-sm ${(!NAV.showGenealogy && i===NAV.tableIdx)?'btn-primary':''}" style="flex:none;" onclick="NAV.showGenealogy=false; NAV.tableIdx=${i}; NAV.tableHideCol=null; NAV.tableQuizMode=false; render();">${t.title}</button>`).join('')}
    </div>`;

  if(NAV.showGenealogy){
    return `<div class="screen">${chips}${renderGenealogy()}</div>`;
  }

  return `<div class="screen">
    ${chips}
    <div class="grid2" style="margin-bottom:12px;">
      <button class="btn ${!NAV.tableQuizMode?'btn-primary':''}" onclick="NAV.tableQuizMode=false; render();">표로 보기</button>
      <button class="btn ${NAV.tableQuizMode?'btn-gold':''}" onclick="toggleTableQuiz(true)">매칭 퀴즈 (오개념 브레이커)</button>
    </div>

    ${NAV.tableQuizMode ? renderTableMatchQuiz(topic.table) : `
      <div class="hard-box" style="padding:14px;">
        ${renderTable(topic.table, NAV.tableHideCol)}
      </div>`}

    <button class="btn btn-ghost btn-block" style="margin-top:12px;" onclick="go('topicDetail',{topicId:'${topic.id}'})">${topic.title} 전체 정리 보러가기 →</button>
  </div>`;
}

/* ---------- 매칭 퀴즈: 이 설명은 누구 것일까? (오개념 방지) ---------- */
function newTableMatchQ(table){
  let rIdx, cIdx, text, tries=0;
  do{
    rIdx = Math.floor(Math.random()*table.rows.length);
    cIdx = Math.floor(Math.random()*table.cols.length);
    text = stripMarkup(table.rows[rIdx][cIdx]);
    tries++;
  } while(text.trim().length < 2 && tries < 20);
  return { rowIdx:rIdx, colIdx:cIdx, text, answered:false, picked:null };
}
function toggleTableQuiz(start){
  NAV.tableQuizMode = start;
  const withTable = DATA.filter(t=>t.table);
  const topic = withTable[NAV.tableIdx];
  if(start && !NAV.tmq){
    NAV.tmq = newTableMatchQ(topic.table);
    NAV.tmScore = {c:0,t:0};
  }
  render();
}
function pickTableMatch(colIdx){
  if(NAV.tmq.answered) return;
  NAV.tmq.answered = true;
  NAV.tmq.picked = colIdx;
  NAV.tmScore.t++;
  if(colIdx === NAV.tmq.colIdx) NAV.tmScore.c++;
  render();
}
function nextTableMatch(){
  const withTable = DATA.filter(t=>t.table);
  const topic = withTable[NAV.tableIdx];
  NAV.tmq = newTableMatchQ(topic.table);
  render();
}
function renderTableMatchQuiz(table){
  const q = NAV.tmq;
  return `<div class="hard-box" style="padding:16px;">
    <div class="match-score">이 표 안에서 맞힌 문제: ${NAV.tmScore.c} / ${NAV.tmScore.t}</div>
    <div class="match-stem">${q.text}</div>
    <div class="note" style="margin-bottom:8px;">위 설명은 아래 중 누구의 개념일까요?</div>
    <div style="display:flex; flex-direction:column; gap:8px;">
      ${table.cols.map((c,ci)=>{
        let cls = '';
        if(q.answered){
          if(ci===q.colIdx) cls='btn-correct';
          else if(ci===q.picked) cls='btn-wrong';
        }
        return `<button class="btn ${cls}" ${q.answered?'disabled':''} onclick="pickTableMatch(${ci})">${c}</button>`;
      }).join('')}
    </div>
    ${q.answered ? `
      <div class="note" style="margin-top:10px;">${q.picked===q.colIdx? '정답이에요.' : `정답은 '${table.cols[q.colIdx]}' 이에요.`}</div>
      <button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="nextTableMatch()">다음 문제 →</button>
    ` : ''}
  </div>`;
}

/* ---------- 통계 ---------- */
function renderStats(){
  const prog = overallProgress();
  const wrong = STATE.quiz.wrong || [];
  const hist = STATE.quiz.history || {};
  const today = todayStr();
  const todayStat = hist[today] || {done:0, correct:0};
  return `<div class="screen">
    <div class="hard-box stat-box">
      <div><div class="l">연속 학습</div><div class="v">${STATE.streak.count||0}일</div></div>
      <div><div class="l">전체 진도</div><div class="v">${prog.pct}%</div></div>
    </div>
    <div class="hard-box stat-box">
      <div class="l">오늘 푼 문제</div><div class="v">${todayStat.done}개 (정답 ${todayStat.correct})</div>
    </div>
    <div class="progress-bar" style="margin:0 0 20px;"><div style="width:${prog.pct}%"></div></div>

    <div class="section-title" style="margin-top:0;">단원별 진도</div>
    ${UNIT_ORDER.map(u=>{
      const topics = DATA.filter(t=>t.unit===u);
      let total=0, done=0;
      topics.forEach(t=>{ total+=topicLineCount(t); done+=topicCheckedCount(t); });
      const pct = total? Math.round(done/total*100):0;
      return `<div class="hard-box stat-box"><div class="l">${UNIT_ICON[u]} ${UNIT_LABEL[u]}</div><div class="v">${pct}%</div></div>`;
    }).join('')}

    <div class="section-title">오답노트 (${wrong.length})</div>
    ${wrong.length===0 ? `<div class="empty"><div class="ic">無</div>아직 틀린 문제가 없어요</div>` :
      wrong.slice(0,25).map(w=>`
      <div class="hard-box wrong-item">
        <div>
          <div style="font-weight:700; color:var(--${w.color});">${w.term}</div>
          <div class="note">${w.topicTitle}</div>
        </div>
        <button class="btn btn-sm btn-ghost" onclick="removeWrong('${w.key}')">지우기</button>
      </div>`).join('')}

    <div class="section-title">데이터 관리</div>
    <button class="btn btn-block" style="border-color:var(--red); color:var(--red);" onclick="resetAllData()">학습 기록 전체 초기화</button>

    <div class="section-title">홈 화면에 추가</div>
    <div class="hard-box" style="padding:16px;">
      ${isStandalonePWA() ? `
        <div class="note">이미 홈 화면 앱으로 실행 중이에요.</div>
      ` : `
        <div class="note" style="margin-bottom:10px; line-height:1.7;">
          아이폰·아이패드: Safari 하단(또는 상단) <b style="color:var(--ink);">공유 버튼</b> → <b style="color:var(--ink);">"홈 화면에 추가"</b>를 누르면 아이콘이 생기고, 브라우저 주소창 없이 앱처럼 열려요.
        </div>
        <button id="pwaInstallBtn" class="btn btn-primary btn-block" style="display:none; padding:12px;" onclick="installPWA()">앱 설치하기</button>
      `}
    </div>
  </div>`;
}
function removeWrong(key){
  STATE.quiz.wrong = STATE.quiz.wrong.filter(w=>w.key!==key);
  saveStore(); render();
}
function resetAllData(){
  if(!confirm('체크 표시, 오답노트, 연속학습 기록이 모두 사라져요. 초기화할까요?')) return;
  STATE = { checked:{}, bookmarks:{}, streak:{lastDate:null,count:0}, quiz:{wrong:[], history:{}, lastDate:null, lastSet:[]} };
  saveStore(); go('home');
}

/* ---------- 초기 렌더 ---------- */
document.addEventListener('DOMContentLoaded', ()=>{ render(); });

</script>
